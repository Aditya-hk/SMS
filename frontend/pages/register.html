<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citizen Registration - Smart Municipal Corporation</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="register">
    <header id="site-header"></header>
    <main class="container">
      <h1>Citizen Registration</h1>
      <div id="page-message"></div>
      <div class="card form-narrow">
        <form id="register-form" novalidate>
          <label for="full_name">Full name *</label><input type="text" id="full_name" maxlength="100" />
          <label for="email">Email *</label><input type="email" id="email" maxlength="150" />
          <label for="phone">Phone</label
          ><input type="text" id="phone" maxlength="13" placeholder="10 digit mobile number" />
          <label for="address">Address</label><input type="text" id="address" maxlength="255" />
          <label for="ward">Ward</label><input type="text" id="ward" maxlength="50" />
          <label for="password">Password *</label><input type="password" id="password" autocomplete="new-password" />
          <div class="hint">At least 8 characters with an uppercase letter, a lowercase letter and a number.</div>
          <label for="confirm">Confirm password *</label
          ><input type="password" id="confirm" autocomplete="new-password" /> <br /><button class="btn" type="submit">
            Register
          </button>
        </form>
        <p>Already registered? <a href="/pages/login.html">Login</a></p>
      </div>
    </main>
    <footer class="site-footer">Smart Municipal Corporation System | IIIT Bhopal</footer>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth-pages.js"></script>
  </body>
</html>
