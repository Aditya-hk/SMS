<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Smart Municipal Corporation</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="login">
    <header id="site-header"></header>
    <main class="container">
      <h1>Login</h1>
      <div id="page-message"></div>
      <div class="card form-narrow">
        <form id="login-form" novalidate>
          <label for="email">Email</label><input type="email" id="email" autocomplete="username" />
          <label for="password">Password</label><input type="password" id="password" autocomplete="current-password" />
          <br /><button class="btn" id="login-btn" type="submit">Login</button>
        </form>
        <p>New citizen? <a href="/pages/register.html">Create an account</a></p>
        <p class="hint">Officers, contractors and admins receive their accounts from the administrator.</p>
      </div>
    </main>
    <footer class="site-footer">Smart Municipal Corporation System | Project by Ayush and Aditya</footer>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/auth-pages.js"></script>
  </body>
</html>
