<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check Complaint Status - Smart Municipal Corporation</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="complaint-status">
    <header id="site-header"></header>
    <main class="container">
      <h1>Check Complaint Status</h1>
      <div id="page-message"></div>
      <div class="card form-narrow">
        <form id="track-form">
          <label for="complaint-id">Complaint ID</label>
          <input type="text" id="complaint-id" inputmode="numeric" placeholder="For example 5" required />
          <br /><button class="btn" type="submit">Check status</button>
        </form>
      </div>
      <div id="track-result"></div>
    </main>
    <footer class="site-footer">Smart Municipal Corporation System | IIIT Bhopal</footer>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/public.js"></script>
  </body>
</html>
