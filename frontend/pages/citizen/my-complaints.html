<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Complaints - Smart Municipal Corporation</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="my-complaints" data-role="CITIZEN">
    <header id="site-header"></header>
    <main class="container">
      <h1>My Complaints</h1>
      <div id="page-message"></div>
      <div class="toolbar">
        <div>
          <label for="filter-status">Filter by status</label
          ><select id="filter-status">
            <option value="">All statuses</option>
            <option value="SUBMITTED">SUBMITTED</option>
            <option value="ASSIGNED">ASSIGNED</option>
            <option value="IN_PROGRESS">IN PROGRESS</option>
            <option value="RESOLVED">RESOLVED</option>
            <option value="CLOSED">CLOSED</option>
            <option value="REJECTED">REJECTED</option>
          </select>
        </div>
      </div>
      <div id="complaint-list"></div>
    </main>
    <footer class="site-footer">Smart Municipal Corporation System | Project by Ayush and Aditya</footer>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/citizen.js"></script>
  </body>
</html>
