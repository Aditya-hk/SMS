<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - Smart Municipal Corporation</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="citizen-profile" data-role="CITIZEN">
    <header id="site-header"></header>
    <main class="container">
      <h1>My Profile</h1>
      <div id="page-message"></div>
      <div class="card form-narrow">
        <form id="profile-form" novalidate>
          <label for="full_name">Full name</label><input type="text" id="full_name" maxlength="100" />
          <label for="email">Email (cannot be changed)</label><input type="email" id="email" disabled />
          <label for="phone">Phone</label><input type="text" id="phone" maxlength="13" />
          <label for="address">Address</label><input type="text" id="address" maxlength="255" />
          <label for="ward">Ward</label><input type="text" id="ward" maxlength="50" /> <br /><button
            class="btn"
            type="submit"
          >
            Save profile
          </button>
        </form>
      </div>
    </main>
    <footer class="site-footer">Smart Municipal Corporation System | Project by Ayush and Aditya</footer>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/citizen.js"></script>
  </body>
</html>
